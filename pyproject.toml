[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autometa"
version = "0.1.0"
description = "Tool for updating metadata for audio files."
authors = [{ name = "Jude Alnas" }]
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "more-itertools>=10.8.0",
    "mutagen>=1.47.0,<2",
    "pillow>=12.1.0",
    "pyyaml>=6.0.3",
    "watchdog>=6.0.0",
]

[project.scripts]
autometa = "autometa.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5,<7",
    "pytest>=7",
    "mypy>=1.14.1,<2",
    "flake8>=7.1.1,<8",
]

[tool.hatch.build.targets.sdist]
include = ["src/autometa"]

[tool.hatch.build.targets.wheel]
include = ["src/autometa"]

[tool.hatch.build.targets.wheel.sources]
"src/autometa" = "autometa"

[tool.pytest.ini_options]
pythonpath = ["src"]

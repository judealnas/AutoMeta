[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autometa"
version = "0.1.0"
authors = [
    { name = "Jude Alnas" }
]
license = { file = "LICENSE" }

[tool.setuptools]
packages = ["autometa"]
package-dir = {"" = "src"}


[tool.pytest.ini_options]
pythonpath = ["src"]
log_cli = true